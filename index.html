tify-content:flex-end}.plus{width:31px;height:31px;border-radius:9px;background:#eef2ff;color:#1d4ed8;font-weight:600}.details{display:none;border-top:1px solid var(--line);background:#fbfdff;padding:10px}.details.open{display:block;animation:fade .18s ease}@keyframes fade{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}.pvGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.pv{background:white;border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}.pv span{font-size:10px;color:var(--muted);font-weight:600;text-transform:uppercase}.pv b{display:block;font-size:16px}.detailGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.scriptBox{background:#f8fafc;border:1px solid #dbe5f0;border-left:4px solid var(--sbi);border-radius:12px;padding:10px}.scriptBox h4{margin:0 0 6px;color:var(--navy)}.scriptBox p{margin:6px 0;font-size:13px;font-weight:600;color:#263244;line-height:1.55}.formgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.history{max-height:180px;overflow:auto;background:white;border:1px solid var(--line);border-radius:12px;padding:8px}.hist{border-bottom:1px solid #eef2f7;padding:7px 0;font-size:12px}.hist:last-child{border-bottom:0}.reportPage{background:white;border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);margin-bottom:10px}.reportHead{border-bottom:3px solid var(--navy);padding-bottom:10px;margin-bottom:12px}.reportHead h2{margin:0;color:var(--navy);font-size:24px}.analysis{display:grid;grid-template-columns:1fr 1fr;gap:10px}.analysisBox{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fbfdff}.analysisBox h3{margin:0 0 8px;color:var(--navy)}.tableWrap{overflow:auto}.tbl{width:100%;border-collapse:collapse;background:white}.tbl th{background:#062a5e;color:white;text-align:left;font-size:11px;padding:8px}.tbl td{border-bottom:1px solid var(--line);padding:7px;font-size:12px;font-weight:600}.toast{position:fixed;left:50%;bottom:72px;transform:translateX(-50%);background:#111827;color:white;border-radius:999px;padding:10px 14px;font-weight:600;display:none;z-index:99}.bottom{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid var(--line);display:flex;gap:5px;padding:7px;overflow:auto;z-index:60}.bottom button{border-radius:10px;padding:9px 12px;font-weight:600;background:#f1f5f9}.bottom button.active{background:var(--blue);color:white}@media(max-width:900px){.kpis{grid-template-columns:repeat(3,1fr)}.uploadBox,.analysis,.detailGrid{grid-template-columns:1fr}.filters{grid-template-columns:1fr 1fr}.rowMain{grid-template-columns:30px 64px 1fr 55px 65px 44px 90px 32px}.rowMain .hideM{display:none}.pvGrid{grid-template-columns:repeat(4,1fr)}.formgrid{grid-template-columns:1fr 1fr}.brand{font-size:16px}}@media(max-width:520px){.wrap{padding:8px 7px 76px}.top{height:48px;border-radius:0 0 12px 12px;padding:0 10px}.brand{font-size:15px}.brand small{font-size:9px}.online{font-size:11px;padding:6px 8px}.tabs{padding:8px 0}.tab{padding:8px 10px;font-size:12px}.kpis{grid-template-columns:repeat(2,1fr);gap:6px}.kpi{min-height:50px;padding:7px 8px}.kpi b{font-size:16px}.kpi span{font-size:9px}.card{padding:9px;border-radius:12px}.rowMain{grid-template-columns:28px 48px 1fr 46px 64px 30px;gap:4px;padding:7px}.rowMain .hideS,.rowMain .score,.rowMain .status{display:none}.actions{gap:4px;justify-content:flex-end}.actions .btn.small{font-size:10px;padding:6px 7px;min-width:32px}.actions .wa{display:inline-flex}.plus{width:28px;height:28px;border-radius:8px}.pvGrid{grid-template-columns:repeat(2,1fr)}.filters,.formgrid{grid-template-columns:1fr 1fr}.cell{font-size:11px}.badge{font-size:9px;padding:4px 5px}.bottom button{font-size:11px;padding:8px 10px}.scriptBox p{font-size:12px;line-height:1.5}}@media print{body{background:white}.top,.tabs,.bottom,.noPrint{display:none!important}.wrap{max-width:none;padding:0}.section{display:none!important}#reports{display:block!important}.reportPage{box-shadow:none;border:0;border-radius:0;page-break-after:always}.card{box-shadow:none}}

<body>
<div class="top"><div class="brand">Royalty CRM<small>Mobile Priority Calling • Online • AI Coach</small></div><div id="net" class="online"><i id="netDot" class="dot"></i><span id="netText">Offline</span></div></div>
<div class="wrap">
 <div class="tabs noPrint"><button class="tab active" data-tab="upload">📤 Upload</button><button class="tab" data-tab="calling">📞 Calling</button><button class="tab" data-tab="queue">🔥 Queue</button><button class="tab" data-tab="reports">📄 Reports</button></div>
 <div class="kpis" id="kpis"></div>
 <section class="section active" id="upload">
  <div class="uploadBox">
   <div class="card"><h2 style="margin:0;color:var(--navy)">📤 Smart Report Excel Upload</h2><p class="hint">Excel मधून RCM ID, Name, Mobile, Proposer आणि Jan–Jun PV auto-detect होईल.</p><input id="excel" type="file" class="input" accept=".xlsx,.xls,.csv"><div class="toolbar" style="margin-top:8px"><button class="btn primary" onclick="importExcel()">Excel Import</button><button class="btn green" onclick="saveOnline()">Firebase + Local Save</button><button class="btn" onclick="loadOnline()">Online Load</button><button class="btn red" onclick="clearLocal()">Local Clear</button></div><p id="uploadInfo" class="hint">अजून Excel upload नाही.</p></div>
   <div class="card"><h3 style="margin:0 0 8px;color:var(--navy)">➕ Manual Entry</h3><div class="formgrid" style="grid-template-columns:1fr 1fr"><input id="mId" class="input" placeholder="RCM ID"><input id="mName" class="input" placeholder="Name"><input id="mMobile" class="input" placeholder="Mobile"><input id="mProp" class="input" placeholder="Proposer"><input id="mJun" class="input" type="number" placeholder="Current/Jun PV"><input id="mTotal" class="input" type="number" placeholder="6M PV"></div><button class="btn green" style="margin-top:8px" onclick="addManual()">Add Profile</button></div>
  </div>
 </section>
 <section class="section" id="calling">
  <div class="card noPrint"><div class="filters"><input id="search" class="input" placeholder="Search: RCM ID / Name / Mobile / Proposer" oninput="renderList()"><select id="priorityFilter" onchange="renderList()"><option value="">All Priority</option><option>A</option><option>B</option><option>C</option></select><select id="statusFilter" onchange="renderList()"><option value="">All Status</option><option>Pending</option><option>Called</option><option>Interested</option><option>Follow-up</option><option>Order Done</option><option>Not Picked</option><option>Not Interested</option></select><select id="smartFilter" onchange="renderList()"><option value="">Smart Filter</option><option value="highLow">High 6M + Low Current</option><option value="due">Due Today</option><option value="hot">Interested/Follow-up</option><option value="zero">Current Month Zero</option></select></div></div>
  <div class="crmList" id="list"></div>
 </section>
 <section class="section" id="queue"><div class="card"><h2 style="margin:0;color:var(--navy)">🔥 Today's AI Queue</h2><div id="queueList" class="crmList" style="margin-top:8px"></div></div></section>
 <section class="section" id="reports"><div class="card noPrint"><button class="btn primary" onclick="generateReports()">Refresh Report</button><button class="btn green" onclick="window.print()">Print / PDF</button></div><div id="reportOut"></div></section>
</div>

<script>
const firebaseConfig={apiKey:"AIzaSyBZnEcsBa_TKryez23fGZIqZ7h3GYHAQw8",authDomain:"royalty-1ea13.firebaseapp.com",databaseURL:"https://royalty-1ea13-default-rtdb.firebaseio.com",projectId:"royalty-1ea13",storageBucket:"royalty-1ea13.firebasestorage.app",messagingSenderId:"949490059395",appId:"1:949490059395:web:43d10e270af16b423f33b6",measurementId:"G-3DJE57WYHM"};
const ROOT='royalty_v7_crm';let db=null,people=[],expanded={},history={},charts={};const LS='royalty_v7_local';
const $=id=>document.getElementById(id);const fmt=n=>Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:1});const num=v=>Number(String(v??0).replace(/[^0-9.-]/g,''))||0;const today=()=>new Date().toISOString().slice(0,10);function toast(t){let e=$('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2200)}
function setOnline(ok){$('netDot').classList.toggle('on',ok);$('netText').textContent=ok?'Online':'Offline'}
try{firebase.initializeApp(firebaseConfig);db=firebase.database();db.ref(ROOT+'/ping').set({time:new Date().toISOString()}).then(()=>setOnline(true)).catch(()=>setOnline(false));}catch(e){setOnline(false)}
function showTab(id){document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===id));document.querySelectorAll('.bottom button').forEach((b,i)=>b.classList.toggle('active',['upload','calling','queue','reports'][i]===id));if(id==='queue')renderQueue();if(id==='reports')generateReports();}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));
function pick(row,names){let ks=Object.keys(row);let k=ks.find(x=>names.some(n=>String(x).toLowerCase().replace(/\s/g,'').includes(n.replace(/\s/g,''))));return k?row[k]:''}
function monthVal(row,m){return num(pick(row,[m+'pv',m+' pv',m,'month '+m]));}
function normalize(row,i){let jan=monthVal(row,'jan')||monthVal(row,'january'),feb=monthVal(row,'feb')||monthVal(row,'february'),mar=monthVal(row,'mar')||monthVal(row,'march'),apr=monthVal(row,'apr')||monthVal(row,'april'),may=monthVal(row,'may'),jun=monthVal(row,'jun')||monthVal(row,'june')||num(pick(row,['currentmonthpv','current pv','month pv']));let total=num(pick(row,['totalpv','6month','6m','sixmonth']))||(jan+feb+mar+apr+may+jun);let id=String(pick(row,['rcmid','rcm id','associateid','id','distributorid'])||('RID'+(i+1))).trim();let p={id,rcmId:id,name:String(pick(row,['name','associate','customer','member'])||row[Object.keys(row)[0]]||'').trim(),mobile:String(pick(row,['mobile','phone','contact'])||'').replace(/[^0-9]/g,''),proposer:String(pick(row,['proposer','sponsor','leader','introduced'])||'').trim(),pv:{jan,feb,mar,apr,may,jun},totalPV:total,currentPV:jun,status:'Pending',interest:'',nextDate:'',expectedPV:expected(total,jun),actualPV:0,remarks:'',lastAction:'',updatedAt:''};p.score=score(p);p.priority=priority(p.score);return p}
function expected(t,c){if(t>=4000&&c<300)return 1000;if(t>=2000&&c<300)return 700;if(t>=800)return 400;return 200}
function score(p){let s=25;if(p.totalPV>=4000)s+=25;else if(p.totalPV>=2000)s+=18;else if(p.totalPV>=800)s+=10;if(p.currentPV<100&&p.totalPV>=800)s+=22;if(['Interested','Follow-up'].includes(p.status))s+=18;if(p.nextDate&&p.nextDate<=today())s+=12;if(num(p.expectedPV)>=700)s+=8;if(!p.lastAction)s+=5;if(p.status==='Order Done')s-=25;return Math.max(0,Math.min(100,Math.round(s)))}
function priority(sc){return sc>=80?'A':sc>=60?'B':'C'}
function recalc(){people.forEach(p=>{p.totalPV=num(p.totalPV)||(num(p.pv.jan)+num(p.pv.feb)+num(p.pv.mar)+num(p.pv.apr)+num(p.pv.may)+num(p.pv.jun));p.currentPV=num(p.currentPV)||num(p.pv.jun);p.score=score(p);p.priority=priority(p.score)})}
function importExcel(){let f=$('excel').files[0];if(!f)return toast('Excel select करा');let r=new FileReader();r.onload=e=>{let wb=XLSX.read(e.target.result,{type:'array'}),ws=wb.Sheets[wb.SheetNames[0]],json=XLSX.utils.sheet_to_json(ws,{defval:''});people=json.map(normalize).filter(p=>p.name||p.rcmId);recalc();$('uploadInfo').textContent=`${people.length} profiles imported. Priority calling सुरू करा.`;saveLocal();renderAll();saveOnline();showTab('calling')};r.readAsArrayBuffer(f)}
function addManual(){let total=num($('mTotal').value),jun=num($('mJun').value);let p={id:$('mId').value||'RID'+Date.now(),rcmId:$('mId').value||'RID'+Date.now(),name:$('mName').value||'Manual',mobile:$('mMobile').value,proposer:$('mProp').value,pv:{jan:0,feb:0,mar:0,apr:0,may:0,jun},totalPV:total||jun,currentPV:jun,status:'Pending',interest:'',nextDate:'',expectedPV:expected(total,jun),actualPV:0,remarks:'',lastAction:'',updatedAt:''};p.score=score(p);p.priority=priority(p.score);people.unshift(p);saveLocal();renderAll();saveOnline();showTab('calling')}
function saveLocal(){localStorage.setItem(LS,JSON.stringify({people,history}))}
async function saveOnline(){saveLocal();if(!db){setOnline(false);return}try{let profiles={};people.forEach(p=>profiles[p.rcmId||p.id]=p);await db.ref(ROOT).update({associateProfiles:profiles,followupHistory:history,lastSaved:new Date().toISOString()});setOnline(true);toast('Online saved')}catch(e){setOnline(false);toast('Firebase save failed')}}
async function loadOnline(){if(!db)return toast('Offline');try{let snap=await db.ref(ROOT).get();if(snap.exists()){let v=snap.val();people=Object.values(v.associateProfiles||{});history=v.followupHistory||{};recalc();saveLocal();renderAll();setOnline(true);toast('Online loaded')}else toast('Online data रिकामा आहे')}catch(e){setOnline(false);toast('Load failed')}} 
function clearLocal(){if(confirm('Local data clear?')){people=[];history={};saveLocal();renderAll()}}
function updateField(id,k,v,log=true){let p=people.find(x=>x.id===id||x.rcmId===id);if(!p)return;p[k]=['expectedPV','actualPV','currentPV','totalPV'].includes(k)?num(v):v;p.updatedAt=new Date().toLocaleString('en-IN');recalc();if(log)addHist(p,`${k}: ${v}`);saveLocal();renderAll();saveOnline()}
function quick(id,status){let p=people.find(x=>x.id===id||x.rcmId===id);if(!p)return;p.status=status;p.lastAction=status==='Not Picked'?'Phone':status==='Order Done'?'Order':'Call';p.updatedAt=new Date().toLocaleString('en-IN');addHist(p,`Quick status: ${status}`);recalc();saveLocal();renderAll();saveOnline()}
function addHist(p,note){let key=p.rcmId||p.id;history[key]=history[key]||[];history[key].unshift({time:new Date().toLocaleString('en-IN'),status:p.status,expected:p.expectedPV,actual:p.actualPV,note,remarks:p.remarks||''});history[key]=history[key].slice(0,30)}
function calc(){let total=people.length,high=people.filter(p=>p.priority==='A').length,calls=people.filter(p=>p.status!=='Pending').length,interested=people.filter(p=>['Interested','Follow-up','Order Done'].includes(p.status)).length,orders=people.filter(p=>p.status==='Order Done'||num(p.actualPV)>0).length,expectedPV=people.reduce((s,p)=>s+num(p.expectedPV),0),actualPV=people.reduce((s,p)=>s+num(p.actualPV),0);return{total,high,calls,interested,orders,expectedPV,actualPV}}
function renderKpis(){let c=calc();$('kpis').innerHTML=[['Total',c.total],['High Priority',c.high],['Calls Done',c.calls],['Interested',c.interested],['Orders',c.orders],['Expected PV',fmt(c.expectedPV)],['Actual PV',fmt(c.actualPV)]].map(x=>`<div class="kpi"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')}
function pattern(p){let a=[p.pv.jan,p.pv.feb,p.pv.mar,p.pv.apr,p.pv.may,p.pv.jun].map(num),last2=a[4]+a[5],first3=a[0]+a[1]+a[2];if(p.totalPV>=2000&&p.currentPV<150)return 'HIGH_TOTAL_LOW_CURRENT';if(last2>600)return 'LAST2_ACTIVE';if(first3>700&&(a[3]+a[4]+a[5])<300)return 'EARLY_ACTIVE_NOW_LOW';if(p.currentPV===0&&p.totalPV>=800)return 'ZERO_CURRENT_GOOD_TOTAL';if(p.totalPV<800)return 'LOW_TOTAL';return 'REGULAR'}
function script(p){let pat=pattern(p),call='',wa='',nba='',obj='',close='';if(pat==='HIGH_TOTAL_LOW_CURRENT'){call=`${p.name} जी, तुम्ही मागील 6 महिन्यांत सातत्याने खरेदी केली आहे (${fmt(p.totalPV)} PV), पण या महिन्यात activity कमी दिसते. बहुतेक regular refill planning बाकी असू शकते. आपण छोटा planned basket आज final करूया का?`;nba='आज call + WhatsApp, शक्य असल्यास evening follow-up.';obj='Stock असेल तर फक्त संपणाऱ्या 3–4 daily-use items निवडूया.';close='आज ₹500–₹1000 चा regular basket करू का?'}else if(pat==='LAST2_ACTIVE'){call=`${p.name} जी, तुमची मागील दोन महिन्यांची खरेदी pattern चांगली आहे. Monthly essentials एकत्र plan केले तर saving आणि consistency दोन्ही maintain होतील.`;nba='Repeat order closing करा.';obj='Budget कमी असेल तर essentials basket छोटा ठेवूया.';close='या महिन्याचा basket आज confirm करूया का?'}else if(pat==='EARLY_ACTIVE_NOW_LOW'){call=`${p.name} जी, सुरुवातीला तुमची activity चांगली होती, नंतर थोडा gap दिसतो. Product experience किंवा requirement मध्ये काही issue आहे का? मी योग्य item selection करून देऊ शकतो.`;nba='Feedback call + issue handling.';obj='ज्या product मध्ये शंका आहे ते सोडून दुसरे daily-use items try करूया.';close='एक छोटा re-start basket करून पाहूया का?'}else if(pat==='ZERO_CURRENT_GOOD_TOTAL'){call=`${p.name} जी, तुमचा overall purchase history strong आहे, म्हणजे तुम्ही regular user आहात. या महिन्यात order pending दिसते. घरात लागणारे 3–4 daily-use items घेऊन month complete करूया का?`;nba='Immediate reactivation call.';obj='मोठी order नको; regular items पुरेसे आहेत.';close='आज 3 items final करू का?'}else if(pat==='LOW_TOTAL'){call=`${p.name} जी, पहिल्यांदा मोठी order नको. तुम्ही 2–3 essential products वापरून experience घ्या. आवडलं तर पुढच्या महिन्यात basket वाढवू.`;nba='Trial basket suggest करा.';obj='Risk कमी ठेवण्यासाठी small trial सुरू करूया.';close='2–3 products ची छोटी order करूया का?'}else{call=`${p.name} जी, तुमची खरेदी pattern moderate आहे. आपण regular monthly essentials व्यवस्थित plan केल्यास saving आणि consistency दोन्ही चांगली राहील.`;nba='Need-based follow-up.';obj='गरजेनुसार छोटे basket करूया.';close='तुम्हाला कोणत्या category ची गरज आहे?'}wa=`नमस्कार ${p.name} जी 🙏\nमागील 6 महिन्यांची तुमची खरेदी ${fmt(p.totalPV)} PV आहे आणि या महिन्यात ${fmt(p.currentPV)} PV दिसते. घरातील regular items smart planning करून छोटा basket आज final करूया का?`;return{call,wa,nba,obj,close,pat}}
function waLink(p){return `https://wa.me/91${p.mobile}?text=${encodeURIComponent(script(p).wa)}`}
function rowHTML(p,i){let s=script(p),h=history[p.rcmId]||[];return `<div class="row"><div class="rowMain"><div class="sr">${i+1}</div><div class="badge p${p.priority}">P-${p.priority}</div><button class="nameBtn" onclick="toggle('${p.rcmId}')">${p.name||'-'}<div class="cell">${p.rcmId}</div></button><div class="cell hideS">${p.proposer||'-'}</div><div class="cell"><strong>${fmt(p.currentPV)}</strong></div><div class="cell hideS"><strong>${fmt(p.totalPV)}</strong></div><div class="score">${p.score}</div><div class="status ${p.status.split(' ')[0]}">${p.status}</div><div class="actions"><a class="btn small navy" href="tel:${p.mobile}">☎ Call</a><a class="btn small green wa" target="_blank" href="${waLink(p)}">💬 WA</a><button class="btn small gold" onclick="quick('${p.rcmId}','Interested')">✓</button></div><button class="plus" onclick="toggle('${p.rcmId}')">${expanded[p.rcmId]?'−':'+'}</button></div><div id="det_${p.rcmId}" class="details ${expanded[p.rcmId]?'open':''}"><div class="pvGrid">${['jan','feb','mar','apr','may','jun'].map(m=>`<div class="pv"><span>${m.toUpperCase()}</span><b>${fmt(p.pv[m])}</b></div>`).join('')}<div class="pv"><span>6M Total</span><b>${fmt(p.totalPV)}</b></div></div><div class="detailGrid"><div class="scriptBox"><h4>AI Talking Point</h4><p>${s.call}</p><p><b>Next Action:</b> ${s.nba}</p><p><b>Objection:</b> ${s.obj}</p><p><b>Closing:</b> ${s.close}</p><div class="toolbar"><button class="btn small" onclick="navigator.clipboard.writeText(\`${s.call}\`);toast('Call script copied')">Copy Script</button><button class="btn small green" onclick="navigator.clipboard.writeText(\`${s.wa}\`);toast('WhatsApp copied')">Copy WhatsApp</button></div></div><div><div class="formgrid"><div><label>Status</label><select onchange="updateField('${p.rcmId}','status',this.value)">${['Pending','Called','Interested','Follow-up','Order Done','Not Picked','Not Interested'].map(x=>`<option ${p.status===x?'selected':''}>${x}</option>`).join('')}</select></div><div><label>Expected PV</label><input class="input" type="number" value="${p.expectedPV}" onchange="updateField('${p.rcmId}','expectedPV',this.value)"></div><div><label>Actual PV</label><input class="input" type="number" value="${p.actualPV}" onchange="updateField('${p.rcmId}','actualPV',this.value)"></div><div><label>Next Date</label><input class="input" type="date" value="${p.nextDate||''}" onchange="updateField('${p.rcmId}','nextDate',this.value)"></div><div><label>Last Action</label><select onchange="updateField('${p.rcmId}','lastAction',this.value)">${['','Call','WhatsApp','Visit','Zoom','Order'].map(x=>`<option ${p.lastAction===x?'selected':''}>${x}</option>`).join('')}</select></div></div><label style="margin-top:7px">Remarks</label><textarea rows="2" onchange="updateField('${p.rcmId}','remarks',this.value)" placeholder="काय बोलणं झालं ते लिहा...">${p.remarks||''}</textarea><div class="toolbar" style="margin-top:7px"><button class="btn small green" onclick="quick('${p.rcmId}','Order Done')">Order Done</button><button class="btn small" onclick="quick('${p.rcmId}','Not Picked')">Not Picked</button><button class="btn small primary" onclick="saveOnline()">Save</button></div><h4 style="margin:10px 0 5px;color:var(--navy)">Follow-up History</h4><div class="history">${h.length?h.map(x=>`<div class="hist"><b>${x.time}</b> • ${x.status}<br>${x.note||''}<br><span class="hint">Expected ${fmt(x.expected)} | Actual ${fmt(x.actual)}</span></div>`).join(''):'History नाही'}</div></div></div></div></div>`}
function sortedPeople(){recalc();return [...people].sort((a,b)=>b.score-a.score||b.totalPV-a.totalPV)}
function renderList(){let q=($('search')?.value||'').toLowerCase(),pf=$('priorityFilter')?.value,sf=$('statusFilter')?.value,sm=$('smartFilter')?.value;let arr=sortedPeople().filter(p=>{let ok=(!q||[p.rcmId,p.name,p.mobile,p.proposer].join(' ').toLowerCase().includes(q))&&(!pf||p.priority===pf)&&(!sf||p.status===sf);if(!ok)return false;if(sm==='highLow')return p.totalPV>=800&&p.currentPV<150;if(sm==='due')return p.nextDate&&p.nextDate<=today();if(sm==='hot')return ['Interested','Follow-up'].includes(p.status);if(sm==='zero')return p.currentPV===0;return true});$('list').innerHTML=arr.length?arr.map(rowHTML).join(''):'<div class="card">Record नाही. Excel upload करा.</div>'}
function toggle(id){expanded[id]=!expanded[id];renderList()}
function renderQueue(){let arr=sortedPeople().filter(p=>p.priority==='A'||(p.nextDate&&p.nextDate<=today())||['Interested','Follow-up'].includes(p.status)).slice(0,30);$('queueList').innerHTML=arr.length?arr.map(rowHTML).join(''):'<div class="card">आजची queue रिकामी आहे.</div>'}
function generateReports(){let top=sortedPeople().slice(0,20),react=sortedPeople().filter(p=>p.totalPV>=800&&p.currentPV<100).slice(0,20),c=calc(),loss=react.reduce((s,p)=>s+num(p.expectedPV),0);$('reportOut').innerHTML=`<div class="reportPage"><div class="reportHead"><h2>Royalty CRM – One Page Executive Report</h2><p class="hint">Generated ${new Date().toLocaleString('en-IN')}</p></div><div class="kpis">${[['Total',c.total],['High Priority',c.high],['Calls',c.calls],['Interested',c.interested],['Orders',c.orders],['Expected',fmt(c.expectedPV)],['Actual',fmt(c.actualPV)]].map(x=>`<div class="kpi"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div><div class="analysis"><div class="analysisBox"><h3>CEO Summary</h3><p>सध्या main opportunity high 6 month PV पण current month low असलेल्या customers मध्ये आहे. Priority A customers वर call + WhatsApp + follow-up discipline केल्यास पुढील 3 दिवसांत expected PV pipeline convert होऊ शकते.</p></div><div class="analysisBox"><h3>Scientific Calling Strategy</h3><p>प्रत्येक customer ला त्याच्या Jan–Jun PV pattern नुसार बोलणे आवश्यक आहे. Regular buyers साठी refill planning, gap customers साठी feedback आणि low PV customers साठी trial basket वापरा.</p></div><div class="analysisBox"><h3>Risk</h3><p>Reactivation list मधील estimated lost opportunity: <b>${fmt(loss)} PV</b>. Follow-up delay झाल्यास हा pipeline पुढच्या महिन्यात जाईल.</p></div><div class="analysisBox"><h3>Next 3 Days Plan</h3><p>Day 1: Top 20 Priority calls. Day 2: Interested + Follow-up closing. Day 3: High 6M low current home visit/WhatsApp conversion.</p></div></div></div><div class="reportPage"><div class="reportHead"><h2>Top 20 Priority Customers</h2></div><div class="tableWrap"><table class="tbl"><thead><tr><th>Sr</th><th>RCM ID</th><th>Name</th><th>Current</th><th>6M PV</th><th>Score</th><th>Next Action</th></tr></thead><tbody>${top.map((p,i)=>`<tr><td>${i+1}</td><td>${p.rcmId}</td><td>${p.name}</td><td>${fmt(p.currentPV)}</td><td>${fmt(p.totalPV)}</td><td>${p.score}</td><td>${script(p).nba}</td></tr>`).join('')}</tbody></table></div></div><div class="reportPage"><div class="reportHead"><h2>Reactivation / Lost Opportunity</h2></div><div class="tableWrap"><table class="tbl"><thead><tr><th>Sr</th><th>RCM ID</th><th>Name</th><th>Jan-Jun Pattern</th><th>Expected PV</th><th>Script Type</th></tr></thead><tbody>${react.map((p,i)=>`<tr><td>${i+1}</td><td>${p.rcmId}</td><td>${p.name}</td><td>${['jan','feb','mar','apr','may','jun'].map(m=>fmt(p.pv[m])).join(' | ')}</td><td>${fmt(p.expectedPV)}</td><td>${script(p).pat}</td></tr>`).join('')}</tbody></table></div></div>`}
function renderAll(){renderKpis();renderList();renderQueue();generateReports()}window.addEventListener('load',()=>{let v=JSON.parse(localStorage.getItem(LS)||'{}');people=v.people||[];history=v.history||{};renderAll();if(db)loadOnline()});
</script>
</body></html>
